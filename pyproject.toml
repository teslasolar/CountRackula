[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "countrackula"
version = "0.1.0"
description = "Count Rackula - A counting utility"
readme = "README.md"
authors = [
    {name = "teslasolar"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.8"

[project.scripts]
countrackula = "countrackula.__main__:main"

[project.urls]
Homepage = "https://github.com/teslasolar/CountRackula"
Repository = "https://github.com/teslasolar/CountRackula"

[tool.setuptools]
packages = ["countrackula"]
